<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0f0e0c"/>
  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>
  <!-- Screen frame left (1965 CRT) -->
  <rect x="60" y="80" width="280" height="290" rx="12" fill="none" stroke="#7a7060" stroke-width="3"/>
  <rect x="80" y="100" width="240" height="230" rx="4" fill="#1a1916"/>
  <!-- CRT scanlines -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="80" y1="115" x2="320" y2="115"/><line x1="80" y1="130" x2="320" y2="130"/>
    <line x1="80" y1="145" x2="320" y2="145"/><line x1="80" y1="160" x2="320" y2="160"/>
    <line x1="80" y1="175" x2="320" y2="175"/><line x1="80" y1="190" x2="320" y2="190"/>
    <line x1="80" y1="205" x2="320" y2="205"/><line x1="80" y1="220" x2="320" y2="220"/>
    <line x1="80" y1="235" x2="320" y2="235"/><line x1="80" y1="250" x2="320" y2="250"/>
    <line x1="80" y1="265" x2="320" y2="265"/><line x1="80" y1="280" x2="320" y2="280"/>
    <line x1="80" y1="295" x2="320" y2="295"/>
  </g>
  <!-- Touch point on CRT -->
  <circle cx="200" cy="215" r="30" fill="#c9342a" fill-opacity="0.15" stroke="#c9342a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="200" cy="215" r="18" fill="none" stroke="#c9342a" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="200" cy="215" r="5" fill="#c9342a"/>
  <!-- Finger pointer (1965 style) -->
  <path d="M200,215 L220,160" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="220" cy="155" r="4" fill="#ffffff" fill-opacity="0.5"/>
  <!-- CRT label -->
  <text x="200" y="320" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#7a7060" text-anchor="middle" letter-spacing="2">E.A. JOHNSON · 1965</text>
  <!-- Divider arrow -->
  <text x="380" y="235" font-family="'Barlow Condensed', sans-serif" font-size="40" fill="#c9342a" opacity="0.5" text-anchor="middle">→</text>
  <text x="380" y="255" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#c9342a" opacity="0.5" text-anchor="middle">42 YEARS</text>
  <!-- iPhone silhouette right -->
  <rect x="465" y="80" width="195" height="290" rx="32" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.7"/>
  <rect x="480" y="110" width="165" height="220" rx="6" fill="#1a1916"/>
  <!-- iPhone screen content -->
  <rect x="492" y="130" width="141" height="20" rx="3" fill="#c9342a" fill-opacity="0.4"/>
  <rect x="492" y="158" width="100" height="8" rx="2" fill="#ffffff" fill-opacity="0.15"/>
  <rect x="492" y="172" width="120" height="8" rx="2" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="492" y="186" width="90" height="8" rx="2" fill="#ffffff" fill-opacity="0.1"/>
  <!-- iPhone touch point -->
  <circle cx="562" cy="270" r="28" fill="#c9342a" fill-opacity="0.15" stroke="#c9342a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="562" cy="270" r="16" fill="none" stroke="#c9342a" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="562" cy="270" r="5" fill="#c9342a"/>
  <!-- Home button -->
  <circle cx="562" cy="355" r="12" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- iPhone label -->
  <text x="562" y="320" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#7a7060" text-anchor="middle" letter-spacing="2">iPHONE · 2007</text>
  <!-- Root stamp -->
  <text x="44" y="46" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#c9342a" letter-spacing="3">ROOT · 1965</text>
  <text x="44" y="64" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#ffffff" letter-spacing="2" opacity="0.5">ROYAL RADAR ESTABLISHMENT · UK</text>
  <text x="756" y="430" font-family="'Barlow Condensed', sans-serif" font-weight="900" font-size="13" fill="#c9342a" opacity="0.6" text-anchor="end" letter-spacing="3">ROOTBYTE</text>
</svg>
