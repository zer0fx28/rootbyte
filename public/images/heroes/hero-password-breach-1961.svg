<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0f0e0c"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
  </g>
  <!-- Old computer terminal silhouette -->
  <rect x="80" y="100" width="200" height="160" rx="8" fill="#1a1916" stroke="#7a7060" stroke-width="1.5"/>
  <rect x="95" y="115" width="170" height="110" rx="4" fill="#0f0e0c" stroke="#2a6e4a" stroke-width="1" opacity="0.6"/>
  <!-- Terminal screen lines (password prompt) -->
  <g opacity="0.5">
    <rect x="110" y="130" width="60" height="4" rx="1" fill="#2a6e4a"/>
    <rect x="110" y="142" width="90" height="4" rx="1" fill="#2a6e4a" opacity="0.7"/>
    <rect x="110" y="154" width="40" height="4" rx="1" fill="#2a6e4a" opacity="0.5"/>
    <rect x="155" y="154" width="50" height="4" rx="1" fill="#c9342a" opacity="0.8"/>
    <rect x="110" y="166" width="70" height="4" rx="1" fill="#2a6e4a" opacity="0.4"/>
    <rect x="110" y="178" width="8" height="8" rx="1" fill="#2a6e4a" opacity="0.9"/>
  </g>
  <!-- Terminal base -->
  <rect x="110" y="260" width="140" height="12" rx="2" fill="#1a1916" stroke="#7a7060" stroke-width="1"/>
  <!-- Large lock being split -->
  <g transform="translate(400, 200)">
    <!-- Left half of lock -->
    <g transform="translate(-15, 0)">
      <path d="M-40,-30 L-40,40 L0,40 L0,-30 Z" fill="#1a1916" stroke="#7a7060" stroke-width="1.5"/>
      <path d="M-40,-30 Q-40,-80 -20,-80" fill="none" stroke="#7a7060" stroke-width="3"/>
      <!-- Crack line -->
      <line x1="0" y1="-30" x2="0" y2="40" stroke="#c9342a" stroke-width="2" opacity="0.8"/>
    </g>
    <!-- Right half of lock -->
    <g transform="translate(15, 0)">
      <path d="M0,-30 L0,40 L40,40 L40,-30 Z" fill="#1a1916" stroke="#7a7060" stroke-width="1.5"/>
      <path d="M20,-80 Q40,-80 40,-30" fill="none" stroke="#7a7060" stroke-width="3"/>
      <line x1="0" y1="-30" x2="0" y2="40" stroke="#c9342a" stroke-width="2" opacity="0.8"/>
    </g>
    <!-- Keyhole -->
    <circle cx="0" cy="5" r="8" fill="#c9342a" opacity="0.4"/>
    <rect x="-3" y="5" width="6" height="16" rx="1" fill="#c9342a" opacity="0.4"/>
  </g>
  <!-- Scattering binary fragments -->
  <g fill="#c9342a" opacity="0.15">
    <rect x="470" y="120" width="18" height="6" rx="1" transform="rotate(15,479,123)"/>
    <rect x="490" y="150" width="14" height="6" rx="1" transform="rotate(-20,497,153)"/>
    <rect x="460" y="260" width="20" height="6" rx="1" transform="rotate(25,470,263)"/>
    <rect x="500" y="230" width="12" height="6" rx="1" transform="rotate(-10,506,233)"/>
    <rect x="480" y="180" width="16" height="6" rx="1" transform="rotate(30,488,183)"/>
  </g>
  <g fill="#d4730f" opacity="0.2">
    <rect x="520" y="140" width="16" height="6" rx="1" transform="rotate(-25,528,143)"/>
    <rect x="540" y="200" width="20" height="6" rx="1" transform="rotate(15,550,203)"/>
    <rect x="510" y="250" width="14" height="6" rx="1" transform="rotate(-30,517,253)"/>
  </g>
  <!-- Scattered key fragments -->
  <g stroke="#d4730f" stroke-width="1.5" fill="none" opacity="0.4">
    <circle cx="600" cy="140" r="10"/>
    <line x1="610" y1="140" x2="640" y2="140"/>
    <line x1="625" y1="140" x2="625" y2="150"/>
    <line x1="635" y1="140" x2="635" y2="148"/>
  </g>
  <!-- Another broken key piece -->
  <g stroke="#7a7060" stroke-width="1" fill="none" opacity="0.3">
    <line x1="620" y1="250" x2="670" y2="250"/>
    <line x1="640" y1="250" x2="640" y2="260"/>
    <line x1="655" y1="250" x2="655" y2="258"/>
    <line x1="665" y1="250" x2="665" y2="256"/>
  </g>
  <!-- Red warning flashes -->
  <circle cx="400" cy="200" r="60" fill="#c9342a" opacity="0.04"/>
  <circle cx="400" cy="200" r="100" fill="#c9342a" opacity="0.02"/>
</svg>