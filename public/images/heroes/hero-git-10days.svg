<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0f0e0c"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/><line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/><line x1="640" y1="0" x2="640" y2="450"/>
  </g>
  <!-- Git graph visualization -->
  <!-- Main branch line -->
  <line x1="100" y1="225" x2="700" y2="225" stroke="#c9342a" stroke-width="3"/>
  <!-- Commits on main -->
  <circle cx="160" cy="225" r="12" fill="#c9342a" stroke="#0f0e0c" stroke-width="2"/>
  <circle cx="280" cy="225" r="12" fill="#c9342a" stroke="#0f0e0c" stroke-width="2"/>
  <circle cx="400" cy="225" r="12" fill="#c9342a" stroke="#0f0e0c" stroke-width="2"/>
  <circle cx="520" cy="225" r="12" fill="#c9342a" stroke="#0f0e0c" stroke-width="2"/>
  <circle cx="640" cy="225" r="14" fill="#c9342a" stroke="#0f0e0c" stroke-width="2"/>
  <!-- Feature branch -->
  <path d="M280,225 Q310,225 320,160 L520,160 Q530,160 520,225" fill="none" stroke="#d4730f" stroke-width="2.5"/>
  <circle cx="370" cy="160" r="10" fill="#d4730f" stroke="#0f0e0c" stroke-width="2"/>
  <circle cx="460" cy="160" r="10" fill="#d4730f" stroke="#0f0e0c" stroke-width="2"/>
  <!-- Fix branch -->
  <path d="M400,225 Q430,225 440,300 L560,300 Q570,300 580,225" fill="none" stroke="#2a6e4a" stroke-width="2"/>
  <circle cx="490" cy="300" r="10" fill="#2a6e4a" stroke="#0f0e0c" stroke-width="2"/>
  <!-- Commit labels -->
  <text x="160" y="254" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#a89e8a" text-anchor="middle">init</text>
  <text x="280" y="254" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#a89e8a" text-anchor="middle">v0.1</text>
  <text x="400" y="254" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#a89e8a" text-anchor="middle">merge</text>
  <text x="520" y="254" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#a89e8a" text-anchor="middle">merge</text>
  <text x="640" y="254" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#c9342a" text-anchor="middle" font-weight="bold">HEAD</text>
  <text x="370" y="148" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#d4730f" text-anchor="middle">feature</text>
  <text x="490" y="318" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#2a6e4a" text-anchor="middle">hotfix</text>
  <!-- Stat box -->
  <rect x="500" y="60" width="260" height="90" rx="4" fill="#1a1916" stroke="#c9342a" stroke-width="1" stroke-opacity="0.5"/>
  <text x="630" y="83" font-family="'Barlow Condensed', sans-serif" font-weight="900" font-size="14" fill="#c9342a" text-anchor="middle" letter-spacing="2">BUILT IN 10 DAYS</text>
  <text x="630" y="102" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#a89e8a" text-anchor="middle">April 3–7, 2005</text>
  <text x="630" y="120" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#7a7060" text-anchor="middle">Linus Torvalds</text>
  <text x="630" y="138" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#7a7060" text-anchor="middle" opacity="0.7">after BitKeeper revoked access</text>
  <!-- Root stamp -->
  <text x="44" y="46" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#c9342a" letter-spacing="3">ROOT · 1972</text>
  <text x="44" y="64" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#ffffff" letter-spacing="2" opacity="0.5">DIFF ALGORITHM · DOUGLAS McILROY</text>
  <text x="756" y="430" font-family="'Barlow Condensed', sans-serif" font-weight="900" font-size="13" fill="#c9342a" opacity="0.6" text-anchor="end" letter-spacing="3">ROOTBYTE</text>
</svg>
