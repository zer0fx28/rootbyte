<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0f0e0c"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/>
  </g>
  <!-- Open fold state (right side) -->
  <g transform="translate(400, 60)">
    <rect x="0" y="0" width="140" height="320" rx="18" fill="#1a1916" stroke="#a89e8a" stroke-width="2.5"/>
    <rect x="10" y="20" width="120" height="280" rx="6" fill="#222018"/>
    <!-- Hinge line -->
    <line x1="0" y1="0" x2="0" y2="320" stroke="#7a7060" stroke-width="3"/>
  </g>
  <!-- Left panel of fold -->
  <g transform="translate(260, 60)">
    <rect x="0" y="0" width="140" height="320" rx="18" fill="#1a1916" stroke="#a89e8a" stroke-width="2.5"/>
    <rect x="10" y="20" width="120" height="280" rx="6" fill="#222018"/>
  </g>
  <!-- Fold screen content combined -->
  <rect x="270" y="80" width="260" height="260" rx="4" fill="#1a4e8c" fill-opacity="0.12"/>
  <text x="400" y="190" font-family="'Barlow Condensed', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" opacity="0.6">GALAXY FOLD</text>
  <text x="400" y="212" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#a89e8a" text-anchor="middle">$1,980 · 2019</text>
  <!-- Crease line indicator -->
  <line x1="400" y1="80" x2="400" y2="340" stroke="#c9342a" stroke-width="1.5" stroke-dasharray="4,3" stroke-opacity="0.6"/>
  <text x="400" y="360" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#c9342a" text-anchor="middle">crease visible after 200 folds</text>
  <!-- IBM ThinkPad 701 butterfly keyboard (left historic) -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="160" height="100" rx="6" fill="#2a2820" stroke="#7a7060" stroke-width="2"/>
    <!-- Keyboard keys schematic -->
    <g fill="#3a3830" stroke="#7a7060" stroke-width="0.5">
      <rect x="10" y="10" width="60" height="30" rx="2"/>
      <rect x="90" y="10" width="60" height="30" rx="2"/>
      <rect x="10" y="50" width="140" height="18" rx="2"/>
    </g>
    <text x="80" y="86" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#7a7060" text-anchor="middle">IBM ThinkPad 701C</text>
    <text x="80" y="98" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#7a7060" text-anchor="middle">"Butterfly" keyboard · 1994</text>
  </g>
  <text x="140" y="258" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#7a7060" text-anchor="middle">First fold mechanism</text>
  <text x="140" y="272" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#7a7060" text-anchor="middle">30 years earlier</text>
  <!-- Attempt counter -->
  <rect x="60" y="290" width="160" height="80" rx="4" fill="#1a0a0a" stroke="#c9342a" stroke-width="1"/>
  <text x="140" y="315" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#c9342a" text-anchor="middle" letter-spacing="1">FAILED LAUNCHES</text>
  <text x="140" y="338" font-family="'Barlow Condensed', sans-serif" font-weight="900" font-size="28" fill="#c9342a" text-anchor="middle">3×</text>
  <text x="140" y="360" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#7a7060" text-anchor="middle">2019 · 2019 · 2023</text>
  <!-- Root stamp -->
  <text x="44" y="400" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#c9342a" letter-spacing="3">ROOT · 1994</text>
  <text x="44" y="418" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#ffffff" letter-spacing="2" opacity="0.5">IBM THINKPAD 701 · BUTTERFLY KEYBOARD</text>
  <text x="756" y="430" font-family="'Barlow Condensed', sans-serif" font-weight="900" font-size="13" fill="#c9342a" opacity="0.6" text-anchor="end" letter-spacing="3">ROOTBYTE</text>
</svg>
