<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0f0e0c"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
  </g>
  <!-- Concentric onion layers -->
  <g transform="translate(320, 200)">
    <!-- Outermost layer -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="#7a7060" stroke-width="2" opacity="0.2"/>
    <!-- Peel effect on outer layer -->
    <path d="M130,-75 Q170,-40 160,10 Q150,60 130,75" fill="none" stroke="#7a7060" stroke-width="2" opacity="0.3"/>
    <!-- Second layer -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="#d4730f" stroke-width="2" opacity="0.3"/>
    <path d="M100,-58 Q130,-25 125,15 Q118,55 100,58" fill="none" stroke="#d4730f" stroke-width="1.5" opacity="0.35"/>
    <!-- Third layer -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#c9342a" stroke-width="2" opacity="0.4"/>
    <path d="M70,-40 Q90,-15 88,10 Q82,38 70,40" fill="none" stroke="#c9342a" stroke-width="1.5" opacity="0.4"/>
    <!-- Fourth layer -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#2a6e4a" stroke-width="2" opacity="0.5"/>
    <!-- Inner core -->
    <circle cx="0" cy="0" r="25" fill="#1a1916" stroke="#2a6e4a" stroke-width="2" opacity="0.7"/>
    <!-- Anchor in center (Navy origin) -->
    <g stroke="#c9342a" stroke-width="2" fill="none" opacity="0.7">
      <!-- Anchor ring -->
      <circle cx="0" cy="-14" r="5"/>
      <!-- Anchor shaft -->
      <line x1="0" y1="-9" x2="0" y2="15"/>
      <!-- Anchor arms -->
      <path d="M-10,10 Q-10,18 0,15 Q10,18 10,10"/>
      <!-- Crossbar -->
      <line x1="-7" y1="-3" x2="7" y2="-3"/>
    </g>
    <!-- Layer fill hints -->
    <circle cx="0" cy="0" r="150" fill="#7a7060" opacity="0.02"/>
    <circle cx="0" cy="0" r="115" fill="#d4730f" opacity="0.03"/>
    <circle cx="0" cy="0" r="80" fill="#c9342a" opacity="0.03"/>
    <circle cx="0" cy="0" r="50" fill="#2a6e4a" opacity="0.04"/>
  </g>
  <!-- Network nodes (right side) -->
  <g transform="translate(580, 200)">
    <!-- Central relay node -->
    <circle cx="0" cy="0" r="8" fill="#c9342a" opacity="0.5"/>
    <!-- Surrounding nodes -->
    <circle cx="60" cy="-50" r="5" fill="#d4730f" opacity="0.4"/>
    <circle cx="80" cy="20" r="5" fill="#d4730f" opacity="0.4"/>
    <circle cx="40" cy="70" r="5" fill="#d4730f" opacity="0.4"/>
    <circle cx="-30" cy="80" r="5" fill="#2a6e4a" opacity="0.4"/>
    <circle cx="100" cy="-20" r="5" fill="#7a7060" opacity="0.3"/>
    <circle cx="90" cy="60" r="5" fill="#7a7060" opacity="0.3"/>
    <circle cx="20" cy="-70" r="5" fill="#2a6e4a" opacity="0.4"/>
    <circle cx="-20" cy="-50" r="5" fill="#7a7060" opacity="0.3"/>
    <!-- Connections -->
    <g stroke="#c9342a" stroke-width="1" opacity="0.2">
      <line x1="0" y1="0" x2="60" y2="-50"/>
      <line x1="0" y1="0" x2="80" y2="20"/>
      <line x1="0" y1="0" x2="40" y2="70"/>
      <line x1="0" y1="0" x2="-30" y2="80"/>
      <line x1="0" y1="0" x2="20" y2="-70"/>
      <line x1="0" y1="0" x2="-20" y2="-50"/>
      <line x1="60" y1="-50" x2="100" y2="-20"/>
      <line x1="80" y1="20" x2="100" y2="-20"/>
      <line x1="80" y1="20" x2="90" y2="60"/>
      <line x1="40" y1="70" x2="90" y2="60"/>
      <line x1="20" y1="-70" x2="60" y2="-50"/>
      <line x1="-20" y1="-50" x2="20" y2="-70"/>
      <line x1="-30" y1="80" x2="40" y2="70"/>
    </g>
  </g>
  <!-- Connection line from onion to network -->
  <line x1="470" y1="200" x2="570" y2="200" stroke="#7a7060" stroke-width="1" stroke-dasharray="4,4" opacity="0.25"/>
  <!-- Data packets flowing -->
  <circle cx="490" cy="200" r="3" fill="#c9342a" opacity="0.4"/>
  <circle cx="520" cy="200" r="3" fill="#d4730f" opacity="0.3"/>
  <circle cx="550" cy="200" r="3" fill="#2a6e4a" opacity="0.3"/>
</svg>