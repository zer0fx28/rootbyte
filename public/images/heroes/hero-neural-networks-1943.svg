<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9342a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f0e0c" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="800" height="450" fill="#0f0e0c"/>
  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/><line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/><line x1="640" y1="0" x2="640" y2="450"/>
  </g>
  <!-- Glow center -->
  <ellipse cx="400" cy="225" rx="200" ry="150" fill="url(#glow)"/>
  <!-- Neural network nodes — input layer -->
  <circle cx="180" cy="120" r="16" fill="none" stroke="#c9342a" stroke-width="2"/>
  <circle cx="180" cy="225" r="16" fill="none" stroke="#c9342a" stroke-width="2"/>
  <circle cx="180" cy="330" r="16" fill="none" stroke="#c9342a" stroke-width="2"/>
  <!-- Hidden layer 1 -->
  <circle cx="340" cy="90" r="16" fill="none" stroke="#d4730f" stroke-width="2"/>
  <circle cx="340" cy="180" r="16" fill="none" stroke="#d4730f" stroke-width="2"/>
  <circle cx="340" cy="270" r="16" fill="none" stroke="#d4730f" stroke-width="2"/>
  <circle cx="340" cy="360" r="16" fill="none" stroke="#d4730f" stroke-width="2"/>
  <!-- Hidden layer 2 -->
  <circle cx="500" cy="120" r="16" fill="none" stroke="#d4730f" stroke-width="2"/>
  <circle cx="500" cy="225" r="16" fill="none" stroke="#d4730f" stroke-width="2"/>
  <circle cx="500" cy="330" r="16" fill="none" stroke="#d4730f" stroke-width="2"/>
  <!-- Output layer -->
  <circle cx="640" cy="180" r="20" fill="#c9342a" fill-opacity="0.2" stroke="#c9342a" stroke-width="2.5"/>
  <circle cx="640" cy="270" r="20" fill="#c9342a" fill-opacity="0.2" stroke="#c9342a" stroke-width="2.5"/>
  <!-- Connections — input to h1 -->
  <g stroke="#c9342a" stroke-opacity="0.2" stroke-width="1" fill="none">
    <line x1="196" y1="120" x2="324" y2="90"/><line x1="196" y1="120" x2="324" y2="180"/>
    <line x1="196" y1="120" x2="324" y2="270"/><line x1="196" y1="120" x2="324" y2="360"/>
    <line x1="196" y1="225" x2="324" y2="90"/><line x1="196" y1="225" x2="324" y2="180"/>
    <line x1="196" y1="225" x2="324" y2="270"/><line x1="196" y1="225" x2="324" y2="360"/>
    <line x1="196" y1="330" x2="324" y2="90"/><line x1="196" y1="330" x2="324" y2="180"/>
    <line x1="196" y1="330" x2="324" y2="270"/><line x1="196" y1="330" x2="324" y2="360"/>
  </g>
  <!-- Connections — h1 to h2 -->
  <g stroke="#d4730f" stroke-opacity="0.2" stroke-width="1">
    <line x1="356" y1="90" x2="484" y2="120"/><line x1="356" y1="90" x2="484" y2="225"/><line x1="356" y1="90" x2="484" y2="330"/>
    <line x1="356" y1="180" x2="484" y2="120"/><line x1="356" y1="180" x2="484" y2="225"/><line x1="356" y1="180" x2="484" y2="330"/>
    <line x1="356" y1="270" x2="484" y2="120"/><line x1="356" y1="270" x2="484" y2="225"/><line x1="356" y1="270" x2="484" y2="330"/>
    <line x1="356" y1="360" x2="484" y2="120"/><line x1="356" y1="360" x2="484" y2="225"/><line x1="356" y1="360" x2="484" y2="330"/>
  </g>
  <!-- Connections — h2 to output -->
  <g stroke="#c9342a" stroke-opacity="0.4" stroke-width="1.5">
    <line x1="516" y1="120" x2="620" y2="180"/><line x1="516" y1="120" x2="620" y2="270"/>
    <line x1="516" y1="225" x2="620" y2="180"/><line x1="516" y1="225" x2="620" y2="270"/>
    <line x1="516" y1="330" x2="620" y2="180"/><line x1="516" y1="330" x2="620" y2="270"/>
  </g>
  <!-- Activated path highlight -->
  <g stroke="#c9342a" stroke-opacity="0.9" stroke-width="2" fill="none">
    <line x1="196" y1="225" x2="324" y2="180"/>
    <line x1="356" y1="180" x2="484" y2="225"/>
    <line x1="516" y1="225" x2="620" y2="270"/>
  </g>
  <circle cx="180" cy="225" r="16" fill="#c9342a" fill-opacity="0.4" stroke="#c9342a" stroke-width="2"/>
  <circle cx="340" cy="180" r="16" fill="#d4730f" fill-opacity="0.4" stroke="#d4730f" stroke-width="2"/>
  <circle cx="500" cy="225" r="16" fill="#d4730f" fill-opacity="0.4" stroke="#d4730f" stroke-width="2"/>
  <circle cx="640" cy="270" r="20" fill="#c9342a" fill-opacity="0.5" stroke="#c9342a" stroke-width="2.5"/>
  <!-- Year stamp -->
  <text x="44" y="56" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#c9342a" letter-spacing="3" opacity="0.9">ROOT · 1943</text>
  <text x="44" y="76" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#ffffff" letter-spacing="2" opacity="0.5">McCULLOCH-PITTS NEURON MODEL</text>
  <!-- Threshold label -->
  <text x="380" y="418" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#ffffff" opacity="0.3" text-anchor="middle">Σ(wᵢxᵢ) ≥ θ → fire</text>
  <!-- RootByte brand -->
  <text x="756" y="430" font-family="'Barlow Condensed', sans-serif" font-weight="900" font-size="13" fill="#c9342a" opacity="0.6" text-anchor="end" letter-spacing="3">ROOTBYTE</text>
</svg>
