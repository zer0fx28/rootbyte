<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0f0e0c"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/>
  </g>
  <!-- Chat UI left - ELIZA 1966 -->
  <rect x="50" y="80" width="300" height="300" rx="6" fill="#1a1916" stroke="#7a7060" stroke-width="1.5"/>
  <rect x="50" y="80" width="300" height="28" rx="6" fill="#2a2820"/>
  <text x="200" y="99" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#7a7060" text-anchor="middle" letter-spacing="2">ELIZA · MIT · 1966</text>
  <!-- ELIZA chat bubbles -->
  <rect x="65" y="120" width="240" height="36" rx="4" fill="#222018"/>
  <text x="78" y="134" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#a89e8a">How do you do. Please tell me</text>
  <text x="78" y="148" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#a89e8a">your problem.</text>
  <rect x="135" y="168" width="200" height="24" rx="4" fill="#2a2820"/>
  <text x="148" y="184" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#d4730f">I feel sad sometimes.</text>
  <rect x="65" y="203" width="230" height="36" rx="4" fill="#222018"/>
  <text x="78" y="217" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#a89e8a">I am sorry to hear you are sad.</text>
  <text x="78" y="231" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#a89e8a">Do you think coming here will help?</text>
  <text x="200" y="268" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#7a7060" text-anchor="middle" font-style="italic">Pattern matching. No understanding.</text>
  <!-- Arrow -->
  <text x="400" y="235" font-family="'Barlow Condensed', sans-serif" font-size="36" fill="#c9342a" opacity="0.5" text-anchor="middle">→</text>
  <text x="400" y="258" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#c9342a" opacity="0.5" text-anchor="middle">60 YEARS</text>
  <!-- Chat UI right - Grok 2025 -->
  <rect x="460" y="80" width="300" height="300" rx="6" fill="#1a1916" stroke="#c9342a" stroke-width="1.5"/>
  <rect x="460" y="80" width="300" height="28" rx="6" fill="#2a0a0a"/>
  <text x="610" y="99" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#c9342a" text-anchor="middle" letter-spacing="2">GROK · xAI · 2025</text>
  <!-- Grok chat bubbles -->
  <rect x="475" y="120" width="260" height="48" rx="4" fill="#222018"/>
  <text x="488" y="137" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#a89e8a">Here's what's trending on X right now:</text>
  <text x="488" y="153" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#a89e8a">real-time feed from 600M users.</text>
  <rect x="545" y="180" width="200" height="24" rx="4" fill="#2a0a0a"/>
  <text x="558" y="196" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#c9342a">Is this answer biased?</text>
  <rect x="475" y="216" width="265" height="48" rx="4" fill="#222018"/>
  <text x="488" y="232" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#a89e8a">Good question. I have access to the</text>
  <text x="488" y="248" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#a89e8a">same data as the people who own me.</text>
  <text x="610" y="290" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#7a7060" text-anchor="middle" font-style="italic">Real-time data. Real-time influence.</text>
  <!-- Root stamp -->
  <text x="44" y="400" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#c9342a" letter-spacing="3">ROOT · 1966</text>
  <text x="44" y="418" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#ffffff" letter-spacing="2" opacity="0.5">ELIZA · JOSEPH WEIZENBAUM · MIT</text>
  <text x="756" y="430" font-family="'Barlow Condensed', sans-serif" font-weight="900" font-size="13" fill="#c9342a" opacity="0.6" text-anchor="end" letter-spacing="3">ROOTBYTE</text>
</svg>
