<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0f0e0c"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
  </g>
  <!-- Old biplane silhouette (left side) -->
  <g transform="translate(180, 180)" fill="none" stroke="#d4730f" stroke-width="1.5" opacity="0.7">
    <!-- Fuselage -->
    <path d="M-80,0 L60,0" stroke-width="2"/>
    <!-- Top wing -->
    <path d="M-30,-25 L50,-25"/>
    <line x1="-20" y1="-25" x2="-20" y2="0"/>
    <line x1="10" y1="-25" x2="10" y2="0"/>
    <line x1="40" y1="-25" x2="40" y2="0"/>
    <!-- Bottom wing -->
    <path d="M-25,10 L45,10"/>
    <!-- Tail -->
    <path d="M-80,0 L-95,-18 L-70,-18 L-65,0"/>
    <path d="M-80,0 L-90,10 L-70,10 L-65,0"/>
    <!-- Propeller -->
    <circle cx="60" cy="0" r="3" fill="#d4730f" opacity="0.5"/>
    <line x1="60" y1="-20" x2="60" y2="20" stroke-width="2"/>
    <!-- Wheels -->
    <circle cx="-10" cy="20" r="6"/>
    <circle cx="30" cy="20" r="6"/>
    <line x1="-10" y1="10" x2="-10" y2="20"/>
    <line x1="30" y1="10" x2="30" y2="20"/>
  </g>
  <!-- Transition / morphing zone -->
  <g opacity="0.2">
    <line x1="320" y1="120" x2="480" y2="120" stroke="#7a7060" stroke-width="1" stroke-dasharray="3,6"/>
    <line x1="320" y1="160" x2="480" y2="160" stroke="#7a7060" stroke-width="1" stroke-dasharray="3,6"/>
    <line x1="320" y1="200" x2="480" y2="200" stroke="#7a7060" stroke-width="1" stroke-dasharray="3,6"/>
    <line x1="320" y1="240" x2="480" y2="240" stroke="#7a7060" stroke-width="1" stroke-dasharray="3,6"/>
    <line x1="320" y1="280" x2="480" y2="280" stroke="#7a7060" stroke-width="1" stroke-dasharray="3,6"/>
  </g>
  <!-- Arrow -->
  <polygon points="395,190 410,200 395,210" fill="#7a7060" opacity="0.3"/>
  <!-- Modern drone quadcopter (right side) -->
  <g transform="translate(620, 170)">
    <!-- Central body -->
    <rect x="-20" y="-10" width="40" height="20" rx="6" fill="#1a1916" stroke="#c9342a" stroke-width="2"/>
    <!-- Arms -->
    <line x1="-20" y1="0" x2="-60" y2="-30" stroke="#c9342a" stroke-width="2"/>
    <line x1="20" y1="0" x2="60" y2="-30" stroke="#c9342a" stroke-width="2"/>
    <line x1="-20" y1="0" x2="-60" y2="30" stroke="#c9342a" stroke-width="2"/>
    <line x1="20" y1="0" x2="60" y2="30" stroke="#c9342a" stroke-width="2"/>
    <!-- Rotors -->
    <circle cx="-60" cy="-30" r="18" fill="none" stroke="#c9342a" stroke-width="1" opacity="0.4"/>
    <circle cx="60" cy="-30" r="18" fill="none" stroke="#c9342a" stroke-width="1" opacity="0.4"/>
    <circle cx="-60" cy="30" r="18" fill="none" stroke="#c9342a" stroke-width="1" opacity="0.4"/>
    <circle cx="60" cy="30" r="18" fill="none" stroke="#c9342a" stroke-width="1" opacity="0.4"/>
    <!-- Rotor centers -->
    <circle cx="-60" cy="-30" r="3" fill="#c9342a" opacity="0.6"/>
    <circle cx="60" cy="-30" r="3" fill="#c9342a" opacity="0.6"/>
    <circle cx="-60" cy="30" r="3" fill="#c9342a" opacity="0.6"/>
    <circle cx="60" cy="30" r="3" fill="#c9342a" opacity="0.6"/>
    <!-- Camera/sensor -->
    <circle cx="0" cy="10" r="4" fill="#2a6e4a" opacity="0.6"/>
  </g>
  <!-- Package hanging below drone -->
  <g transform="translate(620, 220)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#7a7060" stroke-width="1" stroke-dasharray="2,2"/>
    <rect x="-15" y="30" width="30" height="25" rx="2" fill="#1a1916" stroke="#d4730f" stroke-width="1.5"/>
    <line x1="-8" y1="38" x2="8" y2="38" stroke="#d4730f" stroke-width="1" opacity="0.5"/>
    <line x1="-8" y1="44" x2="8" y2="44" stroke="#d4730f" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- Flight path traces -->
  <path d="M100,320 Q200,300 300,310 Q400,320 500,300 Q600,280 700,290" fill="none" stroke="#c9342a" stroke-width="1" opacity="0.15" stroke-dasharray="4,4"/>
</svg>