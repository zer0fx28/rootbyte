<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0f0e0c"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
  </g>
  <!-- 1972 Pulsar blocky digital watch -->
  <g transform="translate(200, 200)">
    <!-- Watch band top -->
    <rect x="-30" y="-120" width="60" height="40" rx="2" fill="#1a1916" stroke="#7a7060" stroke-width="1"/>
    <!-- Watch body - chunky rectangle -->
    <rect x="-50" y="-80" width="100" height="160" rx="4" fill="#1a1916" stroke="#d4730f" stroke-width="2"/>
    <!-- Watch band bottom -->
    <rect x="-30" y="80" width="60" height="40" rx="2" fill="#1a1916" stroke="#7a7060" stroke-width="1"/>
    <!-- Digital display -->
    <rect x="-35" y="-40" width="70" height="40" rx="2" fill="#0f0e0c" stroke="#d4730f" stroke-width="1" opacity="0.6"/>
    <!-- Blocky time segments -->
    <g fill="#c9342a" opacity="0.8">
      <rect x="-25" y="-30" width="8" height="3" rx="0.5"/>
      <rect x="-27" y="-28" width="3" height="10" rx="0.5"/>
      <rect x="-17" y="-28" width="3" height="10" rx="0.5"/>
      <rect x="-25" y="-19" width="8" height="3" rx="0.5"/>
      <rect x="-27" y="-17" width="3" height="10" rx="0.5"/>
      <rect x="-17" y="-17" width="3" height="10" rx="0.5"/>
      <rect x="-25" y="-8" width="8" height="3" rx="0.5"/>
    </g>
    <g fill="#c9342a" opacity="0.8">
      <rect x="-5" y="-30" width="8" height="3" rx="0.5"/>
      <rect x="-7" y="-28" width="3" height="10" rx="0.5"/>
      <rect x="3" y="-28" width="3" height="10" rx="0.5"/>
      <rect x="-5" y="-8" width="8" height="3" rx="0.5"/>
    </g>
    <!-- Colon dots -->
    <circle cx="10" cy="-22" r="1.5" fill="#c9342a" opacity="0.6"/>
    <circle cx="10" cy="-14" r="1.5" fill="#c9342a" opacity="0.6"/>
    <!-- Side button -->
    <rect x="50" y="-15" width="10" height="20" rx="2" fill="#7a7060" opacity="0.5"/>
  </g>
  <!-- Evolution arrow -->
  <g stroke="#7a7060" stroke-width="1" opacity="0.4">
    <line x1="320" y1="200" x2="440" y2="200" stroke-dasharray="6,4"/>
    <polygon points="440,195 455,200 440,205" fill="#7a7060" opacity="0.4"/>
  </g>
  <!-- Evolution dots along arrow -->
  <circle cx="350" cy="200" r="2" fill="#d4730f" opacity="0.3"/>
  <circle cx="380" cy="200" r="2.5" fill="#d4730f" opacity="0.4"/>
  <circle cx="410" cy="200" r="3" fill="#c9342a" opacity="0.5"/>
  <!-- Modern smartwatch -->
  <g transform="translate(580, 200)">
    <!-- Watch band top -->
    <rect x="-25" y="-110" width="50" height="35" rx="8" fill="#1a1916" stroke="#7a7060" stroke-width="1"/>
    <!-- Watch body - rounded square -->
    <rect x="-50" y="-70" width="100" height="140" rx="20" fill="#1a1916" stroke="#c9342a" stroke-width="2"/>
    <!-- Watch band bottom -->
    <rect x="-25" y="70" width="50" height="35" rx="8" fill="#1a1916" stroke="#7a7060" stroke-width="1"/>
    <!-- Screen -->
    <rect x="-38" y="-58" width="76" height="116" rx="14" fill="#0f0e0c" stroke="#c9342a" stroke-width="1" opacity="0.4"/>
    <!-- Heart rate line -->
    <path d="M-28,0 L-15,0 L-10,-20 L-5,25 L0,-15 L5,10 L10,0 L28,0" fill="none" stroke="#c9342a" stroke-width="2" opacity="0.8"/>
    <!-- Activity rings -->
    <circle cx="0" cy="-30" r="12" fill="none" stroke="#c9342a" stroke-width="2.5" opacity="0.6" stroke-dasharray="55,20"/>
    <circle cx="0" cy="-30" r="8" fill="none" stroke="#2a6e4a" stroke-width="2.5" opacity="0.6" stroke-dasharray="40,15"/>
    <circle cx="0" cy="-30" r="4" fill="none" stroke="#d4730f" stroke-width="2.5" opacity="0.6" stroke-dasharray="20,10"/>
    <!-- Small notification dot -->
    <circle cx="30" cy="-50" r="4" fill="#c9342a" opacity="0.6"/>
    <!-- Crown button -->
    <rect x="50" y="-10" width="8" height="16" rx="3" fill="#7a7060" opacity="0.5"/>
  </g>
</svg>