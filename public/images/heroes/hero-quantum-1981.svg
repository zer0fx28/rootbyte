<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0f0e0c"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
  </g>
  <!-- Chalkboard frame -->
  <rect x="60" y="40" width="680" height="320" rx="4" fill="#0f0e0c" stroke="#7a7060" stroke-width="2" opacity="0.5"/>
  <rect x="65" y="45" width="670" height="310" rx="2" fill="none" stroke="#7a7060" stroke-width="0.5" opacity="0.3"/>
  <!-- Chalk dust effect -->
  <g fill="#f5f0e8" opacity="0.03">
    <circle cx="200" cy="100" r="40"/>
    <circle cx="500" cy="150" r="50"/>
    <circle cx="350" cy="280" r="35"/>
  </g>
  <!-- Large atom symbol (center) -->
  <g transform="translate(300, 200)">
    <!-- Electron orbits -->
    <ellipse cx="0" cy="0" rx="90" ry="35" fill="none" stroke="#c9342a" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="90" ry="35" fill="none" stroke="#d4730f" stroke-width="1.5" opacity="0.5" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="90" ry="35" fill="none" stroke="#2a6e4a" stroke-width="1.5" opacity="0.5" transform="rotate(-60)"/>
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="8" fill="#c9342a" opacity="0.7"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#c9342a" stroke-width="1" opacity="0.3"/>
    <!-- Electrons -->
    <circle cx="85" cy="12" r="4" fill="#d4730f" opacity="0.8"/>
    <circle cx="-45" cy="-70" r="4" fill="#2a6e4a" opacity="0.8"/>
    <circle cx="-40" cy="72" r="4" fill="#c9342a" opacity="0.8"/>
  </g>
  <!-- Probability wave (right side, Feynman-inspired) -->
  <g transform="translate(520, 120)">
    <!-- Wave function -->
    <path d="M0,80 Q20,30 40,80 Q60,130 80,80 Q100,30 120,80 Q140,130 160,80 Q180,30 200,80" fill="none" stroke="#d4730f" stroke-width="1.5" opacity="0.6"/>
    <!-- Probability envelope -->
    <path d="M0,80 Q50,20 100,45 Q150,15 200,80" fill="none" stroke="#7a7060" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
    <path d="M0,80 Q50,140 100,115 Q150,145 200,80" fill="none" stroke="#7a7060" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
  </g>
  <!-- Feynman diagram elements (bottom right) -->
  <g transform="translate(580, 280)" stroke="#c9342a" stroke-width="1.5" fill="none" opacity="0.5">
    <!-- Straight fermion lines -->
    <line x1="0" y1="0" x2="40" y2="-30"/>
    <line x1="40" y1="-30" x2="80" y2="0"/>
    <!-- Wavy photon line -->
    <path d="M40,-30 Q45,-45 50,-30 Q55,-15 60,-30 Q65,-45 70,-30 Q75,-15 80,-30 Q85,-45 90,-30" stroke="#d4730f"/>
    <!-- Vertices -->
    <circle cx="40" cy="-30" r="3" fill="#c9342a" opacity="0.6"/>
  </g>
  <!-- Superposition notation (visual, no text) -->
  <g transform="translate(130, 290)" opacity="0.3">
    <!-- Ket bracket visual -->
    <path d="M0,0 L8,-20 L0,-40" fill="none" stroke="#f5f0e8" stroke-width="1.5"/>
    <circle cx="15" cy="-20" r="5" fill="none" stroke="#c9342a" stroke-width="1"/>
    <path d="M25,0 L17,-20 L25,-40" fill="none" stroke="#f5f0e8" stroke-width="1.5"/>
    <!-- Plus -->
    <line x1="35" y1="-20" x2="45" y2="-20" stroke="#f5f0e8" stroke-width="1"/>
    <line x1="40" y1="-25" x2="40" y2="-15" stroke="#f5f0e8" stroke-width="1"/>
    <!-- Another ket -->
    <path d="M55,0 L63,-20 L55,-40" fill="none" stroke="#f5f0e8" stroke-width="1.5"/>
    <circle cx="70" cy="-20" r="5" fill="#c9342a" opacity="0.4"/>
    <path d="M80,0 L72,-20 L80,-40" fill="none" stroke="#f5f0e8" stroke-width="1.5"/>
  </g>
  <!-- Scattered quantum dots -->
  <circle cx="500" cy="300" r="2" fill="#d4730f" opacity="0.4"/>
  <circle cx="650" cy="100" r="2" fill="#c9342a" opacity="0.3"/>
  <circle cx="150" cy="120" r="2" fill="#2a6e4a" opacity="0.3"/>
</svg>