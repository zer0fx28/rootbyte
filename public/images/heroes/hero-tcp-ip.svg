<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0f0e0c"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/><line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/><line x1="640" y1="0" x2="640" y2="450"/>
  </g>
  <!-- Packet visualization -->
  <!-- Source node -->
  <rect x="60" y="195" width="80" height="60" rx="4" fill="#1a4e8c" fill-opacity="0.8"/>
  <text x="100" y="222" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#ffffff" text-anchor="middle">HOST A</text>
  <text x="100" y="237" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#a89e8a" text-anchor="middle">MIT · 1974</text>
  <!-- Packets travelling -->
  <g>
    <!-- Packet 1 -->
    <rect x="180" y="205" width="50" height="28" rx="3" fill="#2a6e4a" fill-opacity="0.9"/>
    <text x="205" y="216" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#ffffff" text-anchor="middle">PKT 1/3</text>
    <text x="205" y="228" font-family="'IBM Plex Mono', monospace" font-size="6" fill="#a89e8a" text-anchor="middle">SYN</text>
    <!-- Packet 2 -->
    <rect x="340" y="205" width="50" height="28" rx="3" fill="#2a6e4a" fill-opacity="0.9"/>
    <text x="365" y="216" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#ffffff" text-anchor="middle">PKT 2/3</text>
    <text x="365" y="228" font-family="'IBM Plex Mono', monospace" font-size="6" fill="#a89e8a" text-anchor="middle">ACK</text>
    <!-- Packet 3 -->
    <rect x="500" y="205" width="50" height="28" rx="3" fill="#2a6e4a" fill-opacity="0.9"/>
    <text x="525" y="216" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#ffffff" text-anchor="middle">PKT 3/3</text>
    <text x="525" y="228" font-family="'IBM Plex Mono', monospace" font-size="6" fill="#a89e8a" text-anchor="middle">DATA</text>
  </g>
  <!-- Router nodes -->
  <polygon points="270,199 290,225 270,251 250,225" fill="#d4730f" fill-opacity="0.6"/>
  <polygon points="430,199 450,225 430,251 410,225" fill="#d4730f" fill-opacity="0.6"/>
  <polygon points="590,199 610,225 590,251 570,225" fill="#d4730f" fill-opacity="0.6"/>
  <!-- Destination node -->
  <rect x="660" y="195" width="80" height="60" rx="4" fill="#1a4e8c" fill-opacity="0.8"/>
  <text x="700" y="222" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#ffffff" text-anchor="middle">HOST B</text>
  <text x="700" y="237" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#a89e8a" text-anchor="middle">Stanford</text>
  <!-- Arrows -->
  <g stroke="#2a6e4a" stroke-width="1.5" fill="none" stroke-opacity="0.7">
    <line x1="140" y1="225" x2="248" y2="225"/>
    <line x1="292" y1="225" x2="408" y2="225"/>
    <line x1="452" y1="225" x2="568" y2="225"/>
    <line x1="612" y1="225" x2="658" y2="225"/>
  </g>
  <!-- Cerf and Kahn -->
  <text x="400" y="90" font-family="'Barlow Condensed', sans-serif" font-weight="900" font-size="18" fill="#c9342a" text-anchor="middle" letter-spacing="2">CERF &amp; KAHN · 1974</text>
  <text x="400" y="110" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#7a7060" text-anchor="middle">"A Protocol for Packet Network Intercommunication"</text>
  <!-- Stats bottom -->
  <rect x="100" y="300" width="600" height="80" rx="4" fill="#1a1916" stroke="#7a7060" stroke-width="1" stroke-opacity="0.4"/>
  <text x="200" y="326" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#a89e8a" text-anchor="middle">Devices online</text>
  <text x="200" y="348" font-family="'Barlow Condensed', sans-serif" font-weight="900" font-size="24" fill="#2a6e4a" text-anchor="middle">18 BILLION</text>
  <line x1="280" y1="305" x2="280" y2="375" stroke="#7a7060" stroke-width="1" stroke-opacity="0.4"/>
  <text x="400" y="326" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#a89e8a" text-anchor="middle">All run on</text>
  <text x="400" y="348" font-family="'Barlow Condensed', sans-serif" font-weight="900" font-size="24" fill="#c9342a" text-anchor="middle">TCP/IP</text>
  <line x1="520" y1="305" x2="520" y2="375" stroke="#7a7060" stroke-width="1" stroke-opacity="0.4"/>
  <text x="620" y="326" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#a89e8a" text-anchor="middle">Protocol written</text>
  <text x="620" y="348" font-family="'Barlow Condensed', sans-serif" font-weight="900" font-size="24" fill="#c9342a" text-anchor="middle">1974</text>
  <!-- Root stamp -->
  <text x="44" y="400" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#c9342a" letter-spacing="3">ROOT · 1962</text>
  <text x="44" y="418" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#ffffff" letter-spacing="2" opacity="0.5">PACKET SWITCHING · PAUL BARAN · RAND</text>
  <text x="756" y="430" font-family="'Barlow Condensed', sans-serif" font-weight="900" font-size="13" fill="#c9342a" opacity="0.6" text-anchor="end" letter-spacing="3">ROOTBYTE</text>
</svg>
