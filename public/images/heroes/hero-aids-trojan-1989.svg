<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0f0e0c"/>
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/>
  </g>
  <!-- Floppy disk -->
  <rect x="240" y="80" width="200" height="220" rx="12" fill="#1a1916" stroke="#7a7060" stroke-width="3"/>
  <!-- Floppy label -->
  <rect x="258" y="98" width="164" height="100" rx="4" fill="#c9342a" fill-opacity="0.15" stroke="#c9342a" stroke-width="1.5"/>
  <text x="340" y="126" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#c9342a" text-anchor="middle" letter-spacing="1">AIDS INFORMATION</text>
  <text x="340" y="144" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#c9342a" text-anchor="middle" letter-spacing="1">INTRODUCTORY</text>
  <text x="340" y="162" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#c9342a" text-anchor="middle" letter-spacing="1">DISKETTE VERSION 2.0</text>
  <text x="340" y="184" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#7a7060" text-anchor="middle">PC Cyborg Corporation</text>
  <!-- Floppy metal slider -->
  <rect x="300" y="254" width="80" height="34" rx="3" fill="#7a7060" stroke="#a89e8a" stroke-width="1"/>
  <rect x="330" y="254" width="20" height="34" fill="#5a5050"/>
  <!-- Skull warning overlay -->
  <text x="580" y="160" font-family="serif" font-size="72" fill="#c9342a" fill-opacity="0.2" text-anchor="middle">☠</text>
  <!-- Info callout -->
  <rect x="480" y="180" width="270" height="140" rx="4" fill="#1a0a0a" stroke="#c9342a" stroke-width="1"/>
  <text x="615" y="204" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#c9342a" text-anchor="middle" letter-spacing="2">WORLD'S FIRST RANSOMWARE</text>
  <line x1="490" y1="214" x2="740" y2="214" stroke="#c9342a" stroke-width="1" stroke-opacity="0.4"/>
  <text x="615" y="232" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#a89e8a" text-anchor="middle">Delivered by post: 20,000</text>
  <text x="615" y="248" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#a89e8a" text-anchor="middle">floppy disks mailed globally</text>
  <text x="615" y="272" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#a89e8a" text-anchor="middle">Ransom: $189 USD</text>
  <text x="615" y="290" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#7a7060" text-anchor="middle">Payable to: P.O. Box Panama</text>
  <text x="615" y="308" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#7a7060" text-anchor="middle">Joseph Popp, Harvard PhD</text>
  <!-- Timeline -->
  <text x="100" y="380" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#7a7060" letter-spacing="1">1989</text>
  <line x1="140" y1="375" x2="680" y2="375" stroke="#c9342a" stroke-width="1" stroke-opacity="0.4"/>
  <text x="700" y="380" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#c9342a" letter-spacing="1">2024</text>
  <text x="400" y="395" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#a89e8a" text-anchor="middle" opacity="0.7">Ransomware cost: $1.1 TRILLION in 2023</text>
  <!-- Root stamp -->
  <text x="44" y="46" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#c9342a" letter-spacing="3">ROOT · 1989</text>
  <text x="44" y="64" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#ffffff" letter-spacing="2" opacity="0.5">AIDS TROJAN · JOSEPH POPP</text>
  <text x="756" y="430" font-family="'Barlow Condensed', sans-serif" font-weight="900" font-size="13" fill="#c9342a" opacity="0.6" text-anchor="end" letter-spacing="3">ROOTBYTE</text>
</svg>
